{
  "version": 1,
  "project": "career-job-compass",
  "requirements": [
    {
      "id": "UX-201",
      "status": "active",
      "title": "All sector filters remain reachable without a horizontal chip rail",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-201\""]},
      "note": "The rejected baseline hid most sector chips beyond the viewport."
    },
    {
      "id": "UX-202",
      "status": "active",
      "title": "Detail and filter surfaces use compact textual controls, not broken decorative placeholders",
      "assert": {"type": "text_absent", "path": "app.js", "needles": ["route-callout-image", "aria-label=\"필터 닫기\">×"]},
      "note": "Human review rejected the giant X placeholder and oversized sheets."
    },
    {
      "id": "UX-203",
      "status": "retired",
      "title": "Mobile routes size to their content rather than a viewport-height hero",
      "assert": {"type": "text_absent", "path": "styles.css", "needles": ["100dvh"]},
      "note": "Human review rejected the large empty areas and bottom-navigation overlap.",
      "retired": {
        "approved_by": "Pin",
        "reason": "Superseded by the explicit 2026-07-27 request to restore the original screen-by-screen tab interaction.",
        "date": "2026-07-27"
      }
    },
    {
      "id": "UX-204",
      "status": "active",
      "title": "Today uses a compact recommendation surface",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-204\""]},
      "note": "Main screen must prioritize readable options over decorative empty space."
    },
    {
      "id": "DATA-201",
      "status": "active",
      "title": "Explicit multi-year experience requirements are excluded from the candidate surface",
      "assert": {"type": "text_present", "path": "scripts/build_snapshot.py", "needles": ["minimumExperienceYears"]},
      "note": "JobKorea source for Hwasein states 5+ years; it must not be recommended."
    },
    {
      "id": "GOV-201",
      "status": "active",
      "title": "The public output is a snapshot and cannot be its own build input",
      "assert": {"type": "text_present", "path": "scripts/build_snapshot.py", "needles": ["--catalog-source"]},
      "note": "A generated app-data.json must never become the next build source."
    },
    {
      "id": "GOV-202",
      "status": "active",
      "title": "Release verification fails when requirement coverage is missing",
      "assert": {"type": "text_present", "path": "scripts/check_release.py", "needles": ["check_requirements.py"]},
      "note": "Existing requirements must remain covered by the automated release gate."
    },
    {
      "id": "REVIEW-001",
      "status": "active",
      "title": "Rejected baseline findings remain represented in the release gate",
      "review_state": "rejected_baseline",
      "assert": {"type": "text_present", "path": "requirements/ledger.yaml", "needles": ["rejected_baseline"]},
      "note": "Mobile screenshots rejected oversized cards, long rails, blank space, and broken detail visuals."
    },
    {
      "id": "UX-205",
      "status": "active",
      "title": "Filter sheet close control uses a readable text action",
      "assert": {"type": "text_absent", "path": "index.html", "needles": ["aria-label=\"필터 닫기\">×"]},
      "note": "Human review rejected the unexplained X-only close control."
    },
    {
      "id": "UX-206",
      "status": "active",
      "title": "Mobile search icons have an explicit compact height",
      "assert": {"type": "text_present", "path": "styles.css", "needles": [".search-box svg { width:18px; height:18px;"]},
      "note": "At 390x844 the search label measured 152px because the SVG used its 150px intrinsic height; target is 44px."
    },
    {
      "id": "UX-207",
      "status": "active",
      "title": "Detail sheets use a readable textual close action",
      "assert": {"type": "text_absent", "path": "app.js", "needles": ["${icon(\"close\")}"]},
      "note": "At 390x844 the unbounded SVG rendered as a giant X instead of a compact close control."
    },
    {
      "id": "GOV-203",
      "status": "active",
      "title": "Initial page load does not automatically contact the private refresh bridge",
      "assert": {"type": "text_absent", "path": "app.js", "needles": ["if (status.state === \"running\") { setEngineBusy(true); await watchRefresh(); }"]},
      "note": "A clean local load produced cross-origin bridge requests without an explicit user action."
    },
    {
      "id": "DATA-202",
      "status": "active",
      "title": "Existing device bookmarks migrate into the synchronized preference store",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-202\"", "migrateLocalBookmarks"]},
      "note": "The current iPhone bookmarks in career-compass-bookmarks must remain liked jobs after the first server sync."
    },
    {
      "id": "UX-208",
      "status": "active",
      "title": "A job can be marked unsuitable with structured reasons and an optional note",
      "assert": {"type": "text_present", "path": "index.html", "needles": ["id=\"feedbackSheet\"", "id=\"feedbackReasons\"", "id=\"feedbackNote\""]},
      "note": "Negative feedback must capture why the posting was not useful instead of storing only a binary dismissal."
    },
    {
      "id": "DATA-203",
      "status": "active",
      "title": "Liked and unsuitable job feedback syncs to Supabase per app user",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-203\"", "syncPreference"]},
      "note": "Every explicit preference update must be persisted immediately while retaining a local offline fallback."
    },
    {
      "id": "UX-209",
      "status": "active",
      "title": "Feedback export includes both liked and unsuitable jobs",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-209\"", "navigator.share", "likedJobs", "dislikedJobs"]},
      "note": "The user needs one mobile-friendly export containing the positive and negative learning signal."
    },
    {
      "id": "SEC-201",
      "status": "active",
      "title": "Preference records are protected by per-user row level security",
      "assert": {"type": "text_present", "path": "supabase/migrations/202607270001_create_job_preferences.sql", "needles": ["enable row level security", "auth.uid()", "with check"]},
      "note": "The browser uses only the public publishable key; no service-role credential is permitted in the app."
    },
    {
      "id": "UX-210",
      "status": "active",
      "title": "The app visibly reports whether preferences are synchronized or local-only",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-210\"", "sync-status"]},
      "note": "A user must be able to distinguish confirmed server persistence from offline local storage."
    },
    {
      "id": "UX-211",
      "status": "active",
      "title": "Every job card exposes visible interested and unsuitable actions",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-211\"", "card-preference-actions", "별로예요"]},
      "note": "Pin could not find the unsuitable feedback entry because it was hidden inside the detail sheet; both actions must be visible on each card."
    },
    {
      "id": "UX-212",
      "status": "active",
      "title": "The feedback screen lists saved jobs and unsuitable reasons",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-212\"", "feedback-review-list", "이유 수정", "아직 별로예요 기록이 없습니다"]},
      "note": "Counts alone are insufficient; the user must be able to inspect which jobs were saved or rejected and see or edit the recorded reason."
    },
    {
      "id": "DATA-204",
      "status": "active",
      "title": "Refresh sends the authenticated Supabase session and uses the full current preference set",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-204\"", "access_token", "Authorization"]},
      "note": "The number of liked or unsuitable rows is never assumed; the server fetches every RLS-visible row for the authenticated user."
    },
    {
      "id": "GOV-204",
      "status": "active",
      "title": "Only the dedicated Career Compass owner can start a personalized refresh",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"GOV-204\"", "personalized refresh requires an authenticated preference session"]},
      "note": "Origin checks alone are insufficient. The bearer session is verified server-side and must resolve to the configured owner user id."
    },
    {
      "id": "DATA-205",
      "status": "active",
      "title": "Refresh visibly traverses preference sync, collection, classification, and snapshot publication",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-205\"", "preferenceSummary", "currentStage"]},
      "note": "The mobile control must expose that all feedback is bound to the run and that the refreshed snapshot was loaded into the app."
    },
    {
      "id": "UX-213",
      "status": "active",
      "title": "Mobile refresh errors name the failed boundary instead of appearing inert",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-213\"", "리프레시 엔진이 꺼져 있습니다", "피드백 인증이 필요합니다"]},
      "note": "An offline PC engine, missing Supabase session, rejected identity, and failed pipeline stage must be distinguishable on iPhone."
    },
    {
      "id": "DATA-206",
      "status": "active",
      "title": "Domestic, overseas, and location-conflict jobs remain visibly distinct",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id-market=\"DATA-206\"", "marketLabel", "확인 필요"]},
      "note": "Unknown or contradictory location evidence must never be silently rendered as domestic on a job card."
    },
    {
      "id": "UX-214",
      "status": "active",
      "title": "All primary mobile controls provide a 44 pixel touch target",
      "assert": {"type": "text_present", "path": "styles.css", "needles": ["--touch-target:44px", "min-height:var(--touch-target)", "min-width:var(--touch-target)"]},
      "note": "Measured on the 390 by 664 iPhone viewport before implementation: round actions were 37x37, preference actions were 127x38, and the detail close action was 52x36."
    },
    {
      "id": "UX-215",
      "status": "active",
      "title": "Mobile refresh shows progress, elapsed time, and an honest remaining-time estimate",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-215\"", "예상 남은 시간", "refreshProgressBar", "refreshElapsed"]},
      "note": "Pin needs enough visible runtime context to decide how long to wait; stage count alone is not a reliable percentage because collection takes longer than publication."
    },
    {
      "id": "DATA-207",
      "status": "active",
      "title": "A successful personalized refresh survives an app restart without contacting the private bridge",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-207\"", "LIVE_SNAPSHOT_STORAGE_KEY", "selectFreshestSnapshot", "store(LIVE_SNAPSHOT_STORAGE_KEY"]},
      "note": "The refreshed snapshot must remain on the same iPhone after the app closes, while a clean load still obeys GOV-203 and does not call the private bridge."
    },
    {
      "id": "DATA-208",
      "status": "active",
      "title": "Every current preference contributes to discovery before personalized ranking",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-208\"", "preferenceDiscovery", "discoveredCandidateCount"]},
      "note": "Measured regression on 2026-07-27: the 14m20s run bound 10 likes but executed no preference-discovery stage. The corrected run must report a discovery artifact derived from the complete variable-length preference set, not a fixed top-N subset."
    },
    {
      "id": "DATA-209",
      "status": "active",
      "title": "The latest personalized snapshot follows the authenticated user across clean mobile sessions",
      "assert": {"type": "text_present", "path": "supabase/migrations/202607270002_create_personalized_snapshots.sql", "needles": ["personalized_snapshots", "auth.uid()", "enable row level security", "with check"]},
      "note": "Measured regression on 2026-07-27: a successful local run could only survive on the same device and production reopened the stale bundled snapshot. The corrected result is stored per authenticated user under RLS; service-role credentials are forbidden in the browser."
    },
    {
      "id": "DATA-210",
      "status": "active",
      "title": "Preference-expanded results remain deduplicated and exclude explicit experienced-only roles",
      "assert": {"type": "text_present", "path": "scripts/build_snapshot.py", "needles": ["DATA-210", "canonical_job_key", "explicit_experience_exclusion"]},
      "note": "Measured regression on 2026-07-27: five copies of the same Hwashin 5+ year role survived into the local snapshot despite DATA-201. Expansion must apply canonical URL/title-employer deduplication and the experience exclusion after merging candidates."
    },
    {
      "id": "DATA-211",
      "status": "active",
      "title": "A completed run is reused only when its full preference digest still matches",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-211\"", "loadMatchingCompletedSnapshot", "BridgeError"]},
      "note": "Measured regression on 2026-07-27: the engine completed once, but an old bridge process prevented publication and the mobile button would unnecessarily start another 11-minute run. The app may reuse the completed result only after the authenticated server proves the current variable-length preference digest matches the run."
    },
    {
      "id": "UX-216",
      "status": "active",
      "title": "Mobile routes use screen-by-screen navigation with explicit previous and next controls",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-216\"", "data-action=\"page-next\"", "movePage"]},
      "note": "Measured regression on 2026-07-27: the iPhone view rendered every page as one continuous document because the max-width 760px rules disabled page snapping and hid page-turn controls. Restore the accepted screen-by-screen interaction without removing feedback or refresh controls."
    },
    {
      "id": "UX-217",
      "status": "active",
      "title": "Liked jobs live in a dedicated saved route",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-217\"", "renderSaved", "저장한 공고"]},
      "note": "Pin confirmed on the physical iPhone that previously liked jobs must not return to the dashboard foreground. They remain available in a separate Saved tab regardless of how many likes exist."
    },
    {
      "id": "DATA-212",
      "status": "active",
      "title": "Recommendation surfaces contain only jobs without an existing like or dislike decision",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"DATA-212\"", "recommendationJobs", "sentiment"]},
      "note": "The refreshed snapshot may retain liked jobs so their details remain available, but Today and Explore must exclude both liked and unsuitable jobs and recommend only unevaluated candidates."
    },
    {
      "id": "UX-218",
      "status": "active",
      "title": "A reused completed run never displays the age of the old run as current waiting time",
      "assert": {"type": "text_present", "path": "app.js", "needles": ["data-requirement-id=\"UX-218\"", "refreshRequestedAt", "finishedAt"]},
      "note": "Measured regression on the physical iPhone at 21:40 KST: a matching completed run showed 127 minutes 25 seconds elapsed even though this request reused it in about two minutes."
    }
  ]
}
