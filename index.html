<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Compass" />
    <meta name="description" content="V4 공고 행동 후보와 대학원·장학금 연구를 한 번에 읽는 커리어 컴퍼스." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Career Compass — 오늘의 방향</title>
  </head>
  <body>
    <div class="app" id="appShell">
      <header class="topbar">
        <a class="wordmark" href="#/today" aria-label="Career Compass 홈">
          <span class="wordmark-mark" aria-hidden="true">C</span>
          <span>Career Compass</span>
        </a>
        <div class="topbar-actions">
          <span class="source-pill" aria-label="공개 스냅샷 기준일">
            <i aria-hidden="true"></i><span id="snapshotLabel">자료 확인 중</span>
          </span>
          <button class="round-action" id="engineRefresh" type="button" data-action="refresh-engine" aria-label="후보 추천 엔진 다시 실행" hidden>
            <svg aria-hidden="true"><use href="#i-refresh" /></svg>
          </button>
          <button class="round-action" type="button" data-action="open-filters" aria-label="공고 필터 열기">
            <svg aria-hidden="true"><use href="#i-filter" /></svg>
          </button>
        </div>
      </header>

      <div class="offline-notice" id="offlineBanner" role="status" hidden>오프라인입니다. 기기에 저장된 마지막 스냅샷을 보고 있어요.</div>
      <section class="refresh-monitor" id="refreshMonitor" role="status" aria-live="polite" hidden>
        <div class="refresh-monitor-head">
          <div><small>개인 추천 엔진</small><strong id="refreshProgressTitle">갱신 준비 중</strong></div>
          <b id="refreshProgressPercent">0%</b>
        </div>
        <div class="refresh-progress" role="progressbar" aria-label="추천 갱신 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="refreshProgressBar"></i>
        </div>
        <p id="refreshStageLabel">현재 단계를 확인하고 있습니다.</p>
        <div class="refresh-monitor-meta">
          <span id="refreshElapsed">경과 0분</span>
          <span id="refreshEta">예상 남은 시간 계산 중</span>
        </div>
        <small id="refreshPreferenceCount">피드백 반영 건수 확인 중</small>
      </section>

      <main id="mainContent" class="main" tabindex="-1" aria-live="polite">
        <section class="loading" aria-label="자료 불러오는 중"><span>CAREER COMPASS</span><b>오늘의 선택지를 불러오는 중</b></section>
      </main>

      <nav class="bottom-nav" aria-label="주요 화면">
        <a href="#/today" data-tab="today"><svg aria-hidden="true"><use href="#i-home" /></svg><span>오늘</span></a>
        <a href="#/jobs" data-tab="jobs"><svg aria-hidden="true"><use href="#i-search" /></svg><span>탐색</span></a>
        <a href="#/saved" data-tab="saved"><svg aria-hidden="true"><use href="#i-bookmark" /></svg><span>저장</span></a>
        <a href="#/lifestyle" data-tab="lifestyle"><svg aria-hidden="true"><use href="#i-place" /></svg><span>생활</span></a>
        <a href="#/study" data-tab="study"><svg aria-hidden="true"><use href="#i-route" /></svg><span>진학</span></a>
        <a href="#/sources" data-tab="sources"><svg aria-hidden="true"><use href="#i-source" /></svg><span>자료</span></a>
      </nav>
    </div>

    <dialog class="filter-sheet" id="filterSheet" aria-labelledby="filterTitle">
      <form method="dialog" class="sheet-top"><span class="sheet-handle" aria-hidden="true"></span><div><small>공고 탐색</small><h2 id="filterTitle">보기 기준</h2></div><button class="sheet-close" value="cancel">닫기</button></form>
      <form class="filter-form" id="filterForm">
        <label><span>관심 분야</span><select id="sectorFilter"><option value="">전체 분야</option></select></label>
        <label><span>행동 상태</span><select id="queueFilter"><option value="">전체 후보</option><option value="verify">원문 확인</option><option value="hold">추가 검토</option><option value="apply">지원 검토</option><option value="stretch">도전 후보</option></select></label>
        <div class="sheet-actions"><button class="plain-button" id="resetFilters" type="button">초기화</button><button class="solid-button" value="default" type="submit"><span>적용</span><svg aria-hidden="true"><use href="#i-arrow" /></svg></button></div>
      </form>
    </dialog>

    <dialog class="detail-sheet" id="dossier" aria-labelledby="dossierTitle"></dialog>
    <input id="feedbackImport" type="file" accept="application/json,.json" hidden />

    <dialog class="filter-sheet feedback-sheet" id="feedbackSheet" aria-labelledby="feedbackTitle">
      <form method="dialog" class="sheet-top"><span class="sheet-handle" aria-hidden="true"></span><div><small>개인화 피드백</small><h2 id="feedbackTitle">공고 피드백</h2></div><button class="sheet-close" value="cancel">닫기</button></form>
      <form class="filter-form" id="feedbackForm">
        <input id="feedbackJobId" type="hidden" />
        <input id="feedbackSentiment" type="hidden" />
        <fieldset id="feedbackReasons">
          <legend id="feedbackLegend">이유를 골라주세요</legend>
          <div id="feedbackReasonChoices"></div>
        </fieldset>
        <label><span>메모 (선택)</span><textarea id="feedbackNote" maxlength="2000" rows="3" placeholder="다음 공고를 고를 때 참고할 점"></textarea></label>
        <p class="feedback-form-error" id="feedbackError" role="alert" aria-live="polite"></p>
        <div class="sheet-actions"><button class="plain-button" id="feedbackClear" type="button">기록 삭제</button><button class="solid-button" type="submit"><span>피드백 저장</span><svg aria-hidden="true"><use href="#i-arrow" /></svg></button></div>
      </form>
    </dialog>

    <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4" /><path d="m16 16 4.2 4.2" /></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><path d="M5 19c8 0 2-14 14-14M14 3l5 2-2 5M5 5h4M5 12h4" /></symbol>
      <symbol id="i-source" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" /></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4" /><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.2M20 5v6h-6" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10v17l-5-3-5 3z" /></symbol>
      <symbol id="i-bookmark-fill" viewBox="0 0 24 24"><path d="M7 4h10v17l-5-3-5 3z" fill="currentColor" /></symbol>
      <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" /><circle cx="12" cy="9" r="2.2" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M19 14v5H5V5h5" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20 8.5c0 5-8 10-8 10s-8-5-8-10a4 4 0 0 1 7-2.6A4 4 0 0 1 20 8.5Z" /></symbol>
    </svg>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" crossorigin="anonymous" defer></script>
    <script src="./supabase-config.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
